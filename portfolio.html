<!DOCTYPE html>
<html lang="en">
<head>

  <title>QuoteMedia · Portfolio (Qmodii DS)</title>

  <!-- Qmodii Design System — token layer (vendored from the design-system zip) -->
  <link rel="stylesheet" href="qmodii-ds/styles.css" />

  <style>
    /* ---------------------------------------------------------------
       Prototype layout only. Every value is a Qmodii DS token
       (var(--…)) — no bespoke palette. Structure/chrome that the DS
       does not ship as a component is composed here from tokens.
       --------------------------------------------------------------- */
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--surface-ground);
      font-family: var(--font-sans);
      color: var(--text-primary);
      font-size: var(--text-base);
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }

    .pf-app { max-width: 1440px; margin: 0 auto; padding: 20px 24px 96px; }

    /* Top bar: title + app/features + icon toggles */
    .pf-topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--surface-200); }
    .pf-breadcrumb { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: 6px; }
    .pf-breadcrumb span { margin: 0 6px; }
    .pf-breadcrumb b { color: var(--text-secondary); font-weight: var(--weight-medium); }
    .pf-titlerow { display: flex; align-items: center; gap: 8px; }
    .pf-titlerow h1 { margin: 0; font-size: var(--text-2xl); font-weight: var(--weight-bold); letter-spacing: -0.01em; }
    .pf-info { display: inline-flex; color: var(--text-muted); cursor: help; }
    .pf-topright { display: flex; align-items: center; gap: 10px; }
    .pf-iconset { display: inline-flex; gap: 6px; padding-left: 4px; border-left: 1px solid var(--surface-200); margin-left: 4px; }

    /* Toolbar: portfolio picker + actions + version */
    .pf-toolbar { display: flex; align-items: center; gap: 8px; padding: 16px 0 12px; }
    .pf-portsel { min-width: 220px; }
    .pf-version { margin-left: auto; font-family: var(--font-mono); font-size: var(--text-sm); color: var(--text-muted); }

    /* Tab row: TabMenu (left) + grouping/stats (right) */
    .pf-tabsrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--surface-200); flex-wrap: wrap; }
    .pf-tabsrow > :first-child { flex: 1 1 auto; min-width: 0; }
    .pf-tabsright { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; }
    .pf-group-sel { min-width: 150px; }

    .pf-panel { padding-top: 20px; }

    /* Sub-filter row (Holdings) */
    .pf-subfilter { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }

    /* Generic controls row (Charts) */
    .pf-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .pf-controls .pf-spacer { margin-left: auto; }

    /* Table scroll frame for hand-built (grouped/technicals) tables */
    .pf-tablewrap { overflow-x: auto; border: 1px solid var(--surface-200); border-radius: var(--radius-sm); background: var(--surface-0); }

    /* Symbol cell look (blue link + optional dividend badge) */
    .pf-sym { color: var(--primary); font-weight: var(--weight-medium); display: inline-flex; align-items: center; gap: 6px; }
    .pf-dbadge { display: inline-flex; align-items: center; justify-content: center; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 3px; background: #E19A2B; color: #fff; font-size: 10px; font-weight: var(--weight-bold); line-height: 1; }

    /* Hand-built grouped table (DS DataTable has no grouping — gap #1/#2) */
    table.pf-gt { border-collapse: collapse; width: 100%; font-size: var(--text-base); }
    table.pf-gt th, table.pf-gt td { padding: 7px 12px; border-bottom: 1px solid var(--surface-100); white-space: nowrap; }
    table.pf-gt thead th { position: sticky; top: 0; z-index: 2; background: var(--surface-0); font-size: var(--table-header-size, 12px); font-weight: var(--weight-semibold); color: var(--text-secondary); text-align: left; border-bottom: 1px solid var(--surface-200); }
    table.pf-gt th.num, table.pf-gt td.num { text-align: right; font-variant-numeric: tabular-nums; }
    table.pf-gt tr.pf-grouphead td { background: var(--surface-700); color: #fff; font-weight: var(--weight-semibold); padding: 9px 14px; position: sticky; left: 0; }
    table.pf-gt tr.pf-grouphead .pf-grouplabel { display: inline-flex; align-items: center; gap: 8px; color: #7FBEF0; font-weight: var(--weight-semibold); }
    table.pf-gt tr.pf-statrow td { background: var(--surface-0); }
    .pf-statlabel { color: #C97A0E; font-weight: var(--weight-bold); font-size: var(--text-sm); letter-spacing: 0.02em; }
    table.pf-gt tr.pf-statrow { border-top: 1px dashed var(--surface-200); }

    /* Popover (Stats / Columns) — DS has no checkbox-dropdown (gap #5) */
    .pf-pop { position: relative; display: inline-flex; }
    .pf-pop-panel { position: absolute; top: calc(100% + 6px); z-index: 200; min-width: 190px; background: var(--surface-0); border: 1px solid var(--surface-200); border-radius: var(--radius-sm); box-shadow: var(--shadow-overlay, 0 8px 24px rgba(0,0,0,0.12)); padding: 8px; }
    .pf-pop-right { right: 0; } .pf-pop-left { left: 0; }
    .pf-pop-row { display: flex; align-items: center; padding: 6px 8px; border-radius: var(--radius-sm); }
    .pf-pop-row:hover { background: var(--surface-50); }
    .pf-pop-foot { display: flex; justify-content: flex-end; padding-top: 6px; margin-top: 4px; border-top: 1px solid var(--surface-100); }

    /* Charts grid */
    .pf-charts-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    @media (max-width: 1200px) { .pf-charts-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 680px)  { .pf-charts-grid { grid-template-columns: 1fr; } }
    .pf-chartcard-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .pf-chartcard-sym { font-weight: var(--weight-bold); font-size: var(--text-lg); }
    .pf-chartcard-name { color: var(--text-muted); font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; text-align: right; }
    .pf-chartcard-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .pf-chartcard-price { font-family: var(--font-mono); font-weight: var(--weight-medium); font-size: var(--text-xl); }

    /* Section headline (Performance) */
    .pf-headline { display: flex; align-items: baseline; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
    .pf-headline .val { font-family: var(--font-mono); font-size: var(--text-3xl); font-weight: var(--weight-medium); }
    .pf-headline .lbl { color: var(--text-muted); font-size: var(--text-sm); text-transform: uppercase; letter-spacing: 0.06em; font-weight: var(--weight-semibold); }
    .pf-chart-frame { overflow-x: auto; border: 1px solid var(--surface-200); border-radius: var(--radius-sm); background: var(--surface-0); padding: 12px; }

    /* Meters (Ownership / Technicals) */
    .pf-meter { height: 6px; border-radius: var(--radius-full); background: var(--surface-100); overflow: hidden; }
    .pf-meter > span { display: block; height: 100%; background: var(--primary); border-radius: inherit; }
    .pf-metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 1000px) { .pf-metric-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px)  { .pf-metric-grid { grid-template-columns: 1fr; } }
    .pf-own-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
    .pf-own-row .k { color: var(--text-secondary); font-size: var(--text-sm); }
    .pf-own-row .v { font-family: var(--font-mono); font-size: var(--text-sm); }
    .pf-holders { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--surface-100); }
    .pf-range { display: flex; align-items: center; gap: 8px; }
    .pf-range .n { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--text-secondary); }
    .pf-range .bar { position: relative; flex: 1 1 auto; height: 4px; background: var(--surface-100); border-radius: var(--radius-full); }
    .pf-range .bar i { position: absolute; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); transform: translateX(-50%); }

    /* Profile */
    .pf-profile-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
    @media (max-width: 700px) { .pf-profile-stats { grid-template-columns: repeat(2, 1fr); } }
    .pf-stat { padding: 12px 16px; border-bottom: 1px solid var(--surface-100); border-right: 1px solid var(--surface-100); }
    .pf-stat .k { color: var(--text-muted); font-size: var(--text-sm); margin-bottom: 2px; }
    .pf-stat .v { font-family: var(--font-mono); font-size: var(--text-lg); font-weight: var(--weight-medium); }
    .pf-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 12px; }

    /* Holdings editor drawer */
    .pf-editor-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .pf-editor-toolbar .pf-search { margin-left: auto; min-width: 220px; }
    .pf-egrid { width: 100%; border-collapse: collapse; }
    .pf-egrid thead th { background: var(--surface-700); color: rgba(255,255,255,0.8); font-size: var(--text-sm); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: 0.04em; text-align: left; padding: 10px 10px; position: sticky; top: 0; z-index: 2; }
    .pf-egrid td { padding: 6px 10px; border-bottom: 1px solid var(--surface-100); vertical-align: middle; }
    .pf-egrid td.grip { color: var(--text-muted); cursor: grab; width: 28px; }
    .pf-egrid td.act { width: 40px; text-align: center; }
    .pf-egrid-scroll { max-height: calc(100vh - 220px); overflow: auto; }
    .pf-iconbtn-bare { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: none; background: none; color: var(--text-muted); cursor: pointer; border-radius: var(--radius-sm); }
    .pf-iconbtn-bare:hover { background: var(--surface-50); color: var(--text-secondary); }

    /* Placeholder / empty states */
    .pf-empty { text-align: center; padding: 56px 24px; color: var(--text-muted); }
    .pf-empty .big { font-size: var(--text-lg); color: var(--text-secondary); margin-bottom: 6px; font-weight: var(--weight-medium); }

    .pf-note { margin-bottom: 16px; }

  /* ============================== Number formatting ======================== */
  const nf2 = (v) => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtPrice = (v) => (v == null ? '—' : nf2(v));
  const fmtInt   = (v) => (v == null ? '—' : Math.round(v).toLocaleString('en-US'));
  const fmtMoney = (v) => (v == null ? '—' : '$' + nf2(v));
  const fmtPct   = (v) => (v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(2) + '%');
  const fmtYield = (v) => (v == null ? '—' : v.toFixed(2) + '%');
  const fmtPE    = (v) => (v == null ? '—' : v.toFixed(2));
  const fmtChg   = (v) => (v == null ? '—' : v.toFixed(2));
  const fmtCap   = (v) => {
    if (v == null) return '—';
    if (v >= 1e12) return (v / 1e12).toFixed(2) + 'T';
    if (v >= 1e9)  return (v / 1e9).toFixed(2) + 'B';
    if (v >= 1e6)  return (v / 1e6).toFixed(2) + 'M';
    return v.toLocaleString('en-US');
  };

  /* ============================== Seeded price series ====================== */
  function seedRand(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    return function () { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
  }
  function makeSeries(sym, up, n = 60) {
    const rnd = seedRand(sym);
    const drift = (up ? 1 : -1) * 0.18;
    let v = 100; const out = [v];
    for (let i = 1; i < n; i++) { v += (rnd() - 0.5) * 3 + drift; v = Math.max(6, v); out.push(v); }
    return out;
  }

  /* ============================== Directional sparkline (gap #3) =========== */
  function Sparkline({ data, up, width = 300, height = 96 }) {
    const min = Math.min(...data), max = Math.max(...data), span = max - min || 1;
    const stepX = width / (data.length - 1);
    const y = (v) => height - 6 - ((v - min) / span) * (height - 12);
    const pts = data.map((v, i) => `${(i * stepX).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const stroke = up ? 'var(--buy)' : 'var(--sell)';
    const fill = up ? '#5DB678' : '#DC5A59';
    const gid = (up ? 'up' : 'dn') + '-' + data.length + '-' + Math.round(data[0]);
    const area = `0,${height} ` + pts + ` ${width},${height}`;
    return (
      <svg width="100%" viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" style={{ display: 'block' }} aria-hidden>
        <defs>
          <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={fill} stopOpacity="0.35" />
            <stop offset="100%" stopColor={fill} stopOpacity="0.02" />
          </linearGradient>
        </defs>
        <polygon points={area} fill={`url(#${gid})`} />
        <polyline points={pts} fill="none" stroke={stroke} strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round" />
      </svg>
    );
  }

  /* ============================== Grouped table (gap #1 / #2) ============== */
  const GROUP_FIELD = { 'No group': null, 'Sector': 'sector', 'Industry': 'industry', 'Symbol type': 'symtype', 'Exchange': 'exch', 'Country': 'country', 'Currency': 'crncy' };
  const STAT_DEFS = [['Sum', 'SUM'], ['Average', 'AVG'], ['Min', 'MIN'], ['Max', 'MAX'], ['Median', 'MEDIAN']];

  function computeStat(kind, rows, field) {
    const vals = rows.map((r) => r[field]).filter((v) => typeof v === 'number');
    if (!vals.length) return null;
    if (kind === 'SUM') return vals.reduce((a, b) => a + b, 0);
    if (kind === 'AVG') return vals.reduce((a, b) => a + b, 0) / vals.length;
    if (kind === 'MIN') return Math.min(...vals);
    if (kind === 'MAX') return Math.max(...vals);
    if (kind === 'MEDIAN') { const s = [...vals].sort((a, b) => a - b); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
    return null;
  }
  function cellColor(col, raw) {
    if (!col.change || typeof raw !== 'number') return 'var(--text-primary)';
    return raw > 0 ? 'var(--table-buy-fg)' : raw < 0 ? 'var(--table-sell-fg)' : 'var(--text-secondary)';
  }
  function GroupedTable({ rows, columns, groupField, stats }) {
    const groups = useMemo(() => {
      const m = new Map();
      rows.forEach((r) => { const k = r[groupField] || '—'; if (!m.has(k)) m.set(k, []); m.get(k).push(r); });
      return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0]));
    }, [rows, groupField]);
    const activeStats = STAT_DEFS.filter(([label]) => stats[label]).map(([, code]) => code);
    const numClass = (c) => (c.numeric || c.change ? 'num' : '');
    const renderBody = (row) => columns.map((c) => {
      const raw = row[c.field];
      let content;
      if (c.rowHeader && row._stat) content = <span className="pf-statlabel">{row.sym}</span>;
      else content = c.render ? c.render(raw, row) : (raw == null ? '—' : raw);
      const CellTag = c.rowHeader ? 'th' : 'td';
      return (<CellTag key={c.field} className={numClass(c)} scope={c.rowHeader ? 'row' : undefined}
        style={{ color: row._stat && c.rowHeader ? undefined : cellColor(c, raw), fontWeight: c.bold || c.rowHeader ? 'var(--weight-medium)' : undefined }}>{content}</CellTag>);
    });
    const totalW = columns.reduce((a, c) => a + (c.width || 96), 0);
    return (
      <div className="pf-tablewrap">
        <table className="pf-gt" style={{ minWidth: totalW }}>
          <colgroup>{columns.map((c) => <col key={c.field} style={{ width: (c.width || 96) + 'px' }} />)}</colgroup>
          <thead><tr>{columns.map((c) => <th key={c.field} className={numClass(c)}>{c.header}</th>)}</tr></thead>
          {groups.map(([label, gr]) => {
            const statRows = activeStats.map((code) => {
              const sr = { _stat: true, sym: code };
              columns.forEach((c) => { if (c.numeric || c.change) sr[c.field] = computeStat(code, gr, c.field); });
              return sr;
            });
            return (
              <tbody key={label}>
                <tr className="pf-grouphead"><td colSpan={columns.length}><span className="pf-grouplabel"><Icon name="folder" size={15} />{label}</span></td></tr>
                {gr.map((r) => <tr key={r.sym}>{renderBody(r)}</tr>)}
                {statRows.map((sr) => <tr key={label + sr.sym} className="pf-statrow">{renderBody(sr)}</tr>)}
              </tbody>
            );
          })}
        </table>
      </div>
    );
  }

  /* ============================== Popover (gap #5) ========================= */
  function Popover({ trigger, align = 'right', children }) {
    const [open, setOpen] = useState(false);
    const ref = useRef(null);
    useEffect(() => {
      if (!open) return;
      const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
      document.addEventListener('mousedown', h);
      return () => document.removeEventListener('mousedown', h);
    }, [open]);
    return (
      <span className="pf-pop" ref={ref}>
        <span onClick={() => setOpen((o) => !o)}>{trigger}</span>
        {open && <div className={'pf-pop-panel pf-pop-' + align}>{children}</div>}
      </span>
    );
  }

              <div className="pf-holders">
                <div style={{ color: 'var(--text-muted)', fontSize: 'var(--text-sm)', marginBottom: 6 }}>Top holders</div>
                {holders.slice(0, 3).map((h, i) => (
                  <div className="pf-own-row" key={h}><span className="k">{h}</span><span className="v">{(12 - i * 3 + r() * 2).toFixed(1)}%</span></div>
                ))}
              </div>
            </Card>
          );
        })}
      </div>
    );
  }

  function TechnicalsPanel() {
    const rows = DATA.filter((d) => d.sym !== '^SPX').map((d) => {
      const r = seedRand(d.sym + 'tech');
      const rsi = +(28 + r() * 50).toFixed(1);
      const lo = +(d.last * (0.6 + r() * 0.2)).toFixed(2);
      const hi = +(d.last * (1.05 + r() * 0.3)).toFixed(2);
      const pos = Math.max(0, Math.min(100, ((d.last - lo) / (hi - lo)) * 100));
      const macd = rsi > 60 ? 'Buy' : rsi < 40 ? 'Sell' : 'Neutral';
      return { sym: d.sym, div: d.div, last: d.last, rsi, ma50: +(d.last * (0.96 + r() * 0.08)).toFixed(2), ma200: +(d.last * (0.9 + r() * 0.12)).toFixed(2), macd, beta: +(0.6 + r() * 1.2).toFixed(2), lo, hi, pos };
    });
    const COLS = [
      { field: 'sym', header: 'Symbol', rowHeader: true, bold: true, width: 116, render: symCell },
      { field: 'last', header: 'Last', numeric: true, width: 92, render: fmtPrice },
      { field: 'rsi', header: 'RSI (14)', numeric: true, width: 104, render: (v) => v.toFixed(1) },
      { field: 'ma50', header: '50-day MA', numeric: true, width: 116, render: fmtPrice },
      { field: 'ma200', header: '200-day MA', numeric: true, width: 124, render: fmtPrice },
      { field: 'macd', header: 'MACD', width: 104, render: (v) => <Tag severity={v === 'Buy' ? 'buy' : v === 'Sell' ? 'sell' : 'secondary'}>{v}</Tag> },
      { field: 'pos', header: '52-week range', width: 210, render: (_v, r) => (
        <div className="pf-range"><span className="n">{r.lo}</span><span className="bar"><i style={{ left: r.pos + '%' }} /></span><span className="n">{r.hi}</span></div>) },
      { field: 'beta', header: 'Beta', numeric: true, width: 92, render: (v) => v.toFixed(2) },
    ];
    // Range column mixes numeric + custom; render as hand-built for the meter width.
    return <DataTable caption="Technicals" columns={COLS} data={rows} defaultSort={{ field: 'rsi', direction: 'desc' }} maxHeight={600} />;
  }

  function ProfilePanel() {
    const [sym, setSym] = useState('AAPL');
    const d = bySym[sym];
    const stats = [
      ['Market cap', fmtCap(d.mktcap)], ['P/E', fmtPE(d.pe)], ['Yield', fmtYield(d.yld)],
      ['Last', '$' + fmtPrice(d.last)], ['Volume', fmtInt(d.vol)], ['Exchange', d.exch],
    ];
    return (
      <div>
        <div style={{ maxWidth: 320, marginBottom: 16 }}>
          <Select value={sym} onChange={setSym} filter options={DATA.filter((x) => x.sym !== '^SPX').map((x) => ({ label: `${x.sym} — ${x.name}`, value: x.sym }))} />
        </div>
        <Card title={<span>{d.name} <span style={{ color: 'var(--text-muted)', fontWeight: 'var(--weight-regular)' }}>({d.sym})</span></span>}
          subtitle={`${d.exch} · Delayed 15m`} actions={<Change value={d.chg} percent={d.pct} />}>
          <div className="pf-chips">
            <Chip label={d.sector} /><Chip label={d.industry} /><Chip label={d.country} />
          </div>
          <p style={{ color: 'var(--text-secondary)', lineHeight: 'var(--leading-lg)', maxWidth: '72ch' }}>
            {d.name} operates in the {d.industry.toLowerCase()} space within the {d.sector} sector. This profile panel demonstrates the Card, Chip, Divider and Change components composing a company summary. Figures shown are illustrative prototype data.
          </p>
          <Divider />
          <div className="pf-profile-stats">
            {stats.map(([k, v]) => (<div className="pf-stat" key={k}><div className="k">{k}</div><div className="v">{v}</div></div>))}
          </div>
        </Card>
      </div>
    );
  }

  function CustomPanel({ groupField, stats }) {
    const [visible, setVisible] = useState(() => Object.fromEntries(OVERVIEW_COLS.map((c) => [c.field, !['revenue', 'netincome', 'margin', 'stdebt', 'ltdebt'].includes(c.field)])));
    const cols = OVERVIEW_COLS.filter((c) => c.rowHeader || visible[c.field]);
    const trigger = (<Button variant="outlined" severity="secondary" size="sm" rightIcon={<Icon name="chevron-down" size={14} />}>Columns</Button>);
    return (
      <div>
        <div className="pf-controls">
          <Message severity="info" style={{ flex: '1 1 auto' }}>Custom view — a user-defined column set built on the same grid. Toggle columns to tailor it.</Message>
          <Popover trigger={trigger} align="right">
            {OVERVIEW_COLS.filter((c) => !c.rowHeader).map((c) => (
              <div className="pf-pop-row" key={c.field}>
                <Checkbox checked={!!visible[c.field]} onChange={(v) => setVisible((s) => ({ ...s, [c.field]: v }))} label={c.header} size="sm" />
              </div>
            ))}
          </Popover>
        </div>
        {groupField
          ? <GroupedTable rows={DATA} columns={cols} groupField={groupField} stats={stats} />
          : <DataTable caption="Custom view" columns={cols} data={DATA} defaultSort={{ field: 'sym', direction: 'asc' }} maxHeight={620} />}
      </div>
    );
  }

  function FeaturesPanel() {
    const feats = [
      ['Overview', 'Sortable quote grid with fundamental columns, sector grouping and Sum/Avg/Min/Max/Median stat rows.'],
      ['Holdings', 'Positions with cost, shares, market value and gain/loss — filterable by gainers, losers and dividends.'],
      ['Charts', 'A grid of directional performance sparklines with a time-range selector and pagination.'],
      ['Performance', 'Portfolio value over time plus per-holding period returns.'],
      ['Dividends & Ownership', 'Projected income, ex/pay dates, and institutional / insider ownership breakdowns.'],
    ];
    return (
      <div style={{ maxWidth: 760 }}>
        <Card title="About this tool" subtitle="A prototype rebuilt on the Qmodii design system">
          <p style={{ color: 'var(--text-secondary)', lineHeight: 'var(--leading-lg)' }}>
            This is a design-system validation prototype of the QMOD portfolio tool. Every control is a real Qmodii component. Switch back to <b>App</b> to explore the live views.
          </p>
          <Divider />
          {feats.map(([k, v], i) => (
            <div key={k} style={{ padding: '10px 0', borderBottom: i < feats.length - 1 ? '1px solid var(--surface-100)' : 'none' }}>
              <div style={{ fontWeight: 'var(--weight-medium)', marginBottom: 2 }}>{k}</div>
              <div style={{ color: 'var(--text-secondary)', fontSize: 'var(--text-sm)' }}>{v}</div>
            </div>
          ))}
        </Card>
      </div>
    );
  }

  /* ============================== Holdings editor drawer =================== */
  function HoldingsDrawer({ open, onClose }) {
    const [rows, setRows] = useState(() => DATA.slice(0, 15).map((d, i) => ({
      id: i, sym: d.sym, shares: d.shares, price: d.cost, fee: null, date: new Date('2019-06-05'),
    })));
    const [q, setQ] = useState('');
    const shown = rows.filter((r) => r.sym.toLowerCase().includes(q.toLowerCase()));
    const update = (id, key, val) => setRows((rs) => rs.map((r) => (r.id === id ? { ...r, [key]: val } : r)));
    const addRow = () => setRows((rs) => [...rs, { id: Date.now() + Math.round(performance.now()), sym: '', shares: null, price: null, fee: null, date: new Date('2019-06-05') }]);
    const removeRow = (id) => setRows((rs) => rs.filter((r) => r.id !== id));
    return (
      <Drawer open={open} onClose={onClose} title="Holdings" position="right" size={920}>
        <div className="pf-editor-toolbar">
          <Button variant="outlined" severity="secondary" size="sm" leftIcon={<Icon name="plus" size={14} />} onClick={addRow}>Add Ticker</Button>
          <Button variant="outlined" severity="secondary" size="sm" leftIcon={<Icon name="tag" size={14} />}>Heading</Button>
          <Button variant="outlined" severity="secondary" size="sm" leftIcon={<Icon name="minus" size={14} />}>Blank</Button>
          <Button variant="outlined" severity="negative" size="sm" leftIcon={<Icon name="trash" size={14} />} onClick={() => setRows([])}>Clear All</Button>
          <div className="pf-search"><InputText value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search holdings" leftIcon={<Icon name="search" size={15} />} fullWidth /></div>
        </div>
        <div className="pf-egrid-scroll">
          <table className="pf-egrid">
            <thead><tr>
              <th style={{ width: 28 }}></th>
              <th>Symbol</th><th>Number of shares</th><th>Purchase price</th><th>Purchase fee</th><th>Purchase date</th>
              <th style={{ width: 40 }}></th><th style={{ width: 40 }}></th>
            </tr></thead>
            <tbody>
              {shown.map((r) => (
                <tr key={r.id}>
                  <td className="grip"><Icon name="grip" size={16} /></td>
                  <td><InputText value={r.sym} onChange={(e) => update(r.id, 'sym', e.target.value.toUpperCase())} size="sm" fullWidth /></td>
                  <td><InputNumber value={r.shares} onChange={(v) => update(r.id, 'shares', v)} size="sm" showButtons={false} fullWidth /></td>
                  <td><InputNumber value={r.price} onChange={(v) => update(r.id, 'price', v)} size="sm" showButtons={false} prefix="$" fullWidth /></td>
                  <td><InputNumber value={r.fee} onChange={(v) => update(r.id, 'fee', v)} size="sm" showButtons={false} prefix="$" fullWidth /></td>
                  <td><DatePicker value={r.date} onChange={(v) => update(r.id, 'date', v)} size="sm" fullWidth /></td>
                  <td className="act"><button className="pf-iconbtn-bare" title="Add note"><Icon name="comment" size={16} /></button></td>
                  <td className="act"><button className="pf-iconbtn-bare" title="Remove" onClick={() => removeRow(r.id)}><Icon name="x" size={16} /></button></td>
                </tr>
              ))}
              {!shown.length && <tr><td colSpan={8} className="pf-empty">No holdings. Use “Add Ticker” to begin.</td></tr>}
            </tbody>
          </table>
        </div>
      </Drawer>
    );
  }

  /* ============================== App shell ================================ */
  const TABS = ['Overview', 'Holdings', 'Charts', 'Performance', 'Trading', 'Dividends', 'Ownership', 'Technicals', 'Profile', 'Custom']
    .map((t) => ({ label: t, value: t }));

  function App() {
    // URL params (?tab=&group=&stats=1&drawer=1&mode=) let any view/state be
    // deep-linked — used for headless verification; harmless in normal use.
    const qp = new URLSearchParams(location.search);
    const [tab, setTab] = useState(TABS.some((t) => t.value === qp.get('tab')) ? qp.get('tab') : 'Overview');
    const [appMode, setAppMode] = useState(qp.get('mode') === 'Features' ? 'Features' : 'App');
    const [portfolio, setPortfolio] = useState('MAIN');
    const [group, setGroup] = useState(Object.keys(GROUP_FIELD).includes(qp.get('group')) ? qp.get('group') : 'No group');
    const [stats, setStats] = useState(qp.get('stats') === '1' ? { Sum: true, Average: true, Min: true, Max: true, Median: true } : {});
    const [drawer, setDrawer] = useState(qp.get('drawer') === '1');
    const groupField = GROUP_FIELD[group];

    const panel = () => {
      if (appMode === 'Features') return <FeaturesPanel />;
      switch (tab) {
        case 'Overview': return <OverviewPanel groupField={groupField} stats={stats} />;
        case 'Holdings': return <HoldingsPanel onEdit={() => setDrawer(true)} />;
        case 'Charts': return <ChartsPanel />;
        case 'Performance': return <PerformancePanel />;
        case 'Trading': return <TradingPanel />;
        case 'Dividends': return <DividendsPanel />;
        case 'Ownership': return <OwnershipPanel />;
        case 'Technicals': return <TechnicalsPanel />;
        case 'Profile': return <ProfilePanel />;
        case 'Custom': return <CustomPanel groupField={groupField} stats={stats} />;
        default: return null;
      }
    };

    return (
      <div className="pf-app">
        <div className="pf-topbar">
          <div>
            <div className="pf-breadcrumb">Adnan's Lab <span>/</span> <b>Portfolio</b></div>
            <div className="pf-titlerow">
              <h1>Portfolio</h1>
              <Tooltip content="Track holdings, performance, dividends and ownership across your portfolios."><span className="pf-info"><Icon name="info" size={17} /></span></Tooltip>
            </div>
          </div>
          <div className="pf-topright">
            <ToggleButton value={appMode} onChange={setAppMode} options={['App', 'Features']} />
            <div className="pf-iconset">
              <Button iconOnly variant="outlined" severity="plain" size="sm" aria-label="Layout"><Icon name="grid" /></Button>
              <Button iconOnly variant="outlined" severity="plain" size="sm" aria-label="Toggle dark mode" title="Dark mode — not implemented (the DS ships light only)"><Icon name="moon" /></Button>
            </div>
          </div>
        </div>

        <div className="pf-toolbar">
          <Button iconOnly variant="text" severity="plain" size="sm" aria-label="More"><Icon name="kebab" /></Button>
          <div className="pf-portsel"><Select value={portfolio} onChange={setPortfolio} options={['MAIN', 'Retirement', 'Watchlist', 'Dividend income']} /></div>
          <Button iconOnly variant="outlined" severity="plain" size="sm" aria-label="Edit holdings" onClick={() => setDrawer(true)}><Icon name="pencil" /></Button>
          <Button iconOnly variant="outlined" severity="plain" size="sm" aria-label="Refresh"><Icon name="refresh" /></Button>
          <Button iconOnly variant="outlined" severity="plain" size="sm" aria-label="Settings"><Icon name="gear" /></Button>
          <span className="pf-version">v 2026.07.15.2339</span>
        </div>

        <div className="pf-tabsrow">
          <TabMenu model={TABS} value={tab} onChange={(v) => setTab(v)} variant="underline" />
          <div className="pf-tabsright">
            <div className="pf-group-sel"><Select value={group} onChange={setGroup} size="sm" options={Object.keys(GROUP_FIELD)} /></div>
            <StatsControl stats={stats} setStats={setStats} />
          </div>
        </div>

        <div className="pf-panel">{panel()}</div>

        <HoldingsDrawer open={drawer} onClose={() => setDrawer(false)} />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
